library: liboqs
status: experimental
version_range: "0.9.0+"
license: MIT
maintenance: active
website: https://openquantumsafe.org/

ecosystems:
  - c
  - python (liboqs-python)
  - go (liboqs-go)
  - rust (oqs)
  - java (liboqs-java)

supported_primitives:
  - name: ML-KEM (Kyber)
    type: KEM
    parameter_sets: [ML-KEM-512, ML-KEM-768, ML-KEM-1024]
    standard: FIPS 203
  - name: ML-DSA (Dilithium)
    type: signature
    parameter_sets: [ML-DSA-44, ML-DSA-65, ML-DSA-87]
    standard: FIPS 204
  - name: SLH-DSA (SPHINCS+)
    type: signature
    parameter_sets: [SLH-DSA-SHA2-128s, SLH-DSA-SHA2-128f, SLH-DSA-SHA2-192s, SLH-DSA-SHA2-192f, SLH-DSA-SHA2-256s, SLH-DSA-SHA2-256f]
    standard: FIPS 205
  - name: FrodoKEM
    type: KEM
    parameter_sets: [FrodoKEM-640, FrodoKEM-976, FrodoKEM-1344]
  - name: BIKE
    type: KEM
  - name: HQC
    type: KEM
  - name: Falcon
    type: signature
    parameter_sets: [Falcon-512, Falcon-1024]

side_channel_posture: unknown
side_channel_notes: >
  Research-grade implementations. Side-channel resistance varies by
  algorithm and version. Not recommended for production without
  independent review.

platform_support:
  - linux
  - macos
  - windows

known_limitations:
  - Experimental — APIs may change
  - Side-channel posture not uniformly verified
  - Some algorithms may be removed in future versions

references:
  - "https://openquantumsafe.org/"
  - "https://github.com/open-quantum-safe/liboqs"
